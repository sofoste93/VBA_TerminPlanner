name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: tools/WorkbookBuilder/packages.lock.json
      - run: dotnet restore tools/WorkbookBuilder/WorkbookBuilder.csproj --locked-mode
      - run: dotnet build tools/WorkbookBuilder/WorkbookBuilder.csproj --configuration Release --no-restore
      - run: dotnet run --project tools/WorkbookBuilder/WorkbookBuilder.csproj --configuration Release --no-build -- artifacts/TerminPlanner.xlsm
      - uses: actions/upload-artifact@v4
        with:
          name: TerminPlanner-workbook
          path: artifacts/TerminPlanner.xlsm
          if-no-files-found: error
